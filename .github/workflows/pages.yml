name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "uninstall.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # Serve both scripts from the apex so the documented one-liners are
      # https://animalroom.app/install.sh and .../uninstall.sh — the repo root
      # stays the source of truth for each.
      - name: Publish the installer and uninstaller alongside the site
        run: |
          cp install.sh site/install.sh
          cp uninstall.sh site/uninstall.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

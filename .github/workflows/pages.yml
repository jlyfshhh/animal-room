name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "uninstall.sh"
      - "doctor.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Security headers, and why none are set here: GitHub Pages serves the uploaded
# artefact as-is and offers no way to add response headers — no config file, no
# option on this action, nothing. So Content-Security-Policy and Referrer-Policy
# are declared inside each page instead (<meta http-equiv> / <meta name>), which
# browsers honour. What cannot be delivered that way, and is therefore genuinely
# absent: X-Content-Type-Options: nosniff, X-Frame-Options / CSP frame-ancestors,
# Strict-Transport-Security, and Permissions-Policy. Pages also sends
# `access-control-allow-origin: *` on every file and that is not ours to change.
# The pages are static marketing copy with no accounts, forms, scripts, or
# secrets, so the residual risk is small — but it is real, and moving the site
# behind a host that supports headers is the only way to close it.

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    secrets:
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Serve both scripts from the apex so the documented one-liners are
      # https://animalroom.app/install.sh and .../uninstall.sh — the repo root
      # stays the source of truth for each.
      - name: Publish the installer and uninstaller alongside the site
        run: |
          cp install.sh site/install.sh
          cp uninstall.sh site/uninstall.sh
          cp doctor.sh site/doctor.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # Serve the installer from the apex so the documented one-liner is
      # https://animalroom.app/install.sh — the repo root stays the source of truth.
      - name: Publish the installer alongside the site
        run: cp install.sh site/install.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

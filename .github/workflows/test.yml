name: Test installer

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax
        run: bash -n install.sh uninstall.sh doctor.sh tests/install.sh tests/uninstall.sh tests/doctor.sh
      - name: Selection behavior
        run: bash tests/install.sh
      - name: Uninstaller behavior
        run: bash tests/uninstall.sh
      - name: Diagnostics leak nothing
        run: bash tests/doctor.sh
